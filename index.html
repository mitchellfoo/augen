<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>augen</title>
<style>
  :root { --bg:#0c0a08; --ink:#f3ecd8; --dim:rgba(243,236,216,.55); --line:rgba(243,236,216,.18);
    --panel:#15120f; --accent:#f6cf1d; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 Futura,"Avenir Next","Helvetica Neue",Arial,sans-serif; }
  a { color:inherit; }
  .wrap { max-width:1180px; margin:0 auto; padding:32px 24px 64px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:28px; }
  h1 { margin:0; font-size:44px; letter-spacing:.02em; font-weight:700; line-height:1; }
  h1 span { color:var(--accent); }
  .tag { color:var(--dim); font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
  .label { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 0 10px; }

  button, .btn { font:inherit; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink);
    background:transparent; border:1px solid var(--line); border-radius:4px; padding:7px 12px; cursor:pointer; }
  button:hover, .btn:hover { border-color:var(--ink); }
  button.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* source */
  .source { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:16px; margin-bottom:36px; }
  .drop { position:relative; border:1px dashed var(--line); border-radius:8px; padding:20px; background:var(--panel);
    display:flex; gap:18px; align-items:center; min-height:120px; transition:border-color .2s, background .2s; }
  .drop.over { border-color:var(--accent); background:#1d1912; }
  .disc { flex:none; width:72px; height:72px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center;
    background:radial-gradient(circle, var(--bg) 0 14%, transparent 15%), repeating-radial-gradient(circle, #1f1b16 0 2px, #17140f 2px 4px); }
  .has .disc { border-color:var(--accent); animation:spin 6s linear infinite; }
  .disc::after { content:''; width:8px; height:8px; border-radius:50%; background:var(--line); }
  .has .disc::after { background:var(--accent); }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .has .disc { animation:none; } }
  .now { min-width:0; flex:1; }
  .now .name { font-size:20px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now .meta { color:var(--dim); font-size:12px; margin:2px 0 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .lib { border:1px solid var(--line); border-radius:8px; padding:16px 20px; }
  .lib ul { list-style:none; margin:0; padding:0; }
  .lib li + li { border-top:1px solid var(--line); }
  .lib li button { width:100%; text-align:left; border:0; padding:10px 0; font-size:13px; letter-spacing:.02em;
    text-transform:none; display:flex; justify-content:space-between; gap:12px; border-radius:0; }
  .lib li button:hover { color:var(--accent); }
  .lib li button.cur { color:var(--accent); }
  .lib li button span:last-child { color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }

  /* grid */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px; }
  .card { display:flex; flex-direction:column; text-decoration:none; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; background:var(--panel); transition:border-color .2s, transform .2s; }
  .card:hover, .card:focus-visible { border-color:var(--c); transform:translateY(-2px); outline:none; }
  .art { aspect-ratio:16/10; display:block; width:100%; background:#000; }
  .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .body h2 { margin:0; font-size:18px; display:flex; align-items:center; gap:8px; }
  .body h2::before { content:''; width:10px; height:10px; border-radius:2px; background:var(--c); }
  .body p { margin:0; color:var(--dim); font-size:13px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:8px; }
  .chips span { font-size:10px; letter-spacing:.12em; text-transform:uppercase; border:1px solid var(--line);
    border-radius:3px; padding:2px 6px; color:var(--dim); }
  .open { margin-left:auto; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--c); }
  .num { font-variant-numeric:tabular-nums; color:var(--dim); font-weight:400; font-size:12px; margin-left:auto; }

  footer { margin-top:40px; color:var(--dim); font-size:12px; }
  @media (max-width:720px) {
    .wrap { padding:24px 16px 48px; }
    h1 { font-size:36px; }
    .source { grid-template-columns:1fr; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>augen<span>.</span></h1>
    <div class="tag">music visualizers · one song, many eyes</div>
  </header>

  <section class="source" aria-label="Audio source">
    <div class="drop" id="drop">
      <div class="disc" aria-hidden="true"></div>
      <div class="now">
        <p class="label">Source</p>
        <div class="name" id="name">No track yet</div>
        <div class="meta" id="meta">Drop an audio or video file here, or upload one. Every visualizer opens with it.</div>
        <div class="row">
          <button id="upload">Upload</button>
          <button id="preview" hidden>Preview</button>
          <button id="clear" hidden>Clear</button>
        </div>
      </div>
      <input type="file" id="file" accept="audio/*,video/*" hidden>
    </div>
    <div class="lib">
      <p class="label">Library</p>
      <ul id="library"></ul>
    </div>
  </section>

  <p class="label">Visualizers</p>
  <main class="grid" id="grid"></main>

  <footer>Each visualizer still takes its own drops and Load button, and whatever you load there becomes the source here too.</footer>
</div>
<audio id="audio" preload="metadata"></audio>

<script src="shared/source.js"></script>
<script src="catalog.js"></script>
<script>
const $ = s => document.querySelector(s);
const audio = $('#audio');
let url = null, current = null;

/* ---------------- card art: a small still in each visualizer's manner */
const rnd = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ART = {
  synchromy(svg, c) {
    const r = rnd(7), cols = ['#f6cf1d', '#e8553a', '#3a7be8', '#2bb673', '#d94fa3'];
    let s = '';
    for (let i = 0; i < 5; i++) {
      const x = i * 32;
      s += `<rect x="${x}" y="0" width="32" height="100" fill="${cols[i]}" opacity=".92"/>`;
      for (let y = 6; y < 96; y += 6) {
        const w = 6 + r() * 20;
        s += `<rect x="${x + 16 - w / 2}" y="${y}" width="${w}" height="3" fill="#0c0a08"/>`;
      }
    }
    svg.innerHTML = `<rect width="160" height="100" fill="#0c0a08"/>${s}`;
  },
  sculpture(svg, c) {
    svg.innerHTML = `<rect width="160" height="100" fill="#efe6d2"/>
      <ellipse cx="80" cy="84" rx="44" ry="7" fill="#d9ccb2"/>
      <path d="M58 78 C52 60 60 46 72 40 C66 30 74 18 86 20 C98 22 104 34 98 42 C112 48 112 66 102 78 Z" fill="${c}"/>
      <circle cx="84" cy="56" r="9" fill="#efe6d2"/><circle cx="71" cy="66" r="5" fill="#efe6d2"/>
      <path d="M58 78 C52 60 60 46 72 40" fill="none" stroke="#121015" stroke-width="1.5"/>
      <path d="M102 78 C112 66 112 48 98 42" fill="none" stroke="#121015" stroke-width="1.5"/>`;
  },
  massing(svg, c) {
    // a few boxes in isometric, back to front: tan tops, pink walls, grey outlines on green
    const boxes = [[0, 2, 0, 8, 2], [2, 14, 3, 4, 1], [5, 7, 4, 6, 1], [14, 19, 2, 4.5, 2], [19, 21, 2, 4.5, .15]];
    const P = (x, y, z) => [(x - y) * .866, (x + y) * .5 - z * 1.15];
    const pts = boxes.flatMap(([x0, x1, y0, y1, h]) => [P(x0, y1, 0), P(x1, y0, 0), P(x0, y0, h), P(x1, y1, 0)]);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), x0 = Math.min(...xs), y0 = Math.min(...ys);
    const k = Math.min(140 / (Math.max(...xs) - x0), 80 / (Math.max(...ys) - y0)), ox = 80 - (Math.max(...xs) + x0) / 2 * k, oy = 50 - (Math.max(...ys) + y0) / 2 * k;
    const poly = (fill, ...q) => `<polygon points="${q.map(p => P(...p)).map(([x, y]) => `${(ox + x * k).toFixed(1)},${(oy + y * k).toFixed(1)}`).join(' ')}" fill="${fill}" stroke="#7a7a80" stroke-width=".6" stroke-linejoin="round"/>`;
    let s = '';
    for (const [a, b, d, e, h] of [...boxes].sort((p, q) => (p[0] + p[2]) - (q[0] + q[2]))) {
      const top = h < .5 ? '#a3c1d8' : '#d4b990';
      s += poly(c, [b, d, 0], [b, e, 0], [b, e, h], [b, d, h]) + poly(c, [a, e, 0], [b, e, 0], [b, e, h], [a, e, h]) + poly(top, [a, d, h], [b, d, h], [b, e, h], [a, e, h]);
    }
    svg.innerHTML = `<rect width="160" height="100" fill="#43966f"/>${s}`;
  },
  default(svg, c) {
    const r = rnd(3); let d = 'M0 50';
    for (let x = 0; x <= 160; x += 4) d += ` L${x} ${50 + (r() - .5) * 60 * Math.sin(x / 26)}`;
    svg.innerHTML = `<rect width="160" height="100" fill="#0c0a08"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.5"/>`;
  },
};

function renderGrid() {
  $('#grid').innerHTML = '';
  AUGEN.visualizers.forEach((v, i) => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = `visualizers/${v.id}/`; a.style.setProperty('--c', v.accent);
    a.innerHTML = `<svg class="art" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <div class="body"><h2>${v.title}<span class="num">${String(i + 1).padStart(2, '0')}</span></h2><p>${v.blurb}</p>
      <div class="chips">${v.tags.map(t => `<span>${t}</span>`).join('')}<span class="open">Open →</span></div></div>`;
    (ART[v.art] || ART.default)(a.querySelector('svg'), v.accent);
    $('#grid').appendChild(a);
  });
}

function renderLibrary() {
  $('#library').innerHTML = '';
  AUGEN.library.forEach(t => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span>${t.name}</span><span>${current && current.origin === t.file ? 'loaded' : 'use'}</span>`;
    b.classList.toggle('cur', !!current && current.origin === t.file);
    b.onclick = async () => {
      b.lastChild.textContent = 'loading…';
      try { const blob = await (await fetch(t.file)).blob(); await AugenSource.set(blob, t.name, t.file); }
      catch (e) { b.lastChild.textContent = 'could not load'; }
    };
    li.appendChild(b); $('#library').appendChild(li);
  });
}

const fmtSize = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.round(n / 1e3) + ' KB';
const fmtTime = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '';

function show(s) {
  current = s;
  audio.pause(); $('#preview').classList.remove('on'); $('#preview').textContent = 'Preview';
  if (url) URL.revokeObjectURL(url), url = null;
  $('#drop').classList.toggle('has', !!s);
  $('#preview').hidden = $('#clear').hidden = !s;
  $('#upload').textContent = s ? 'Replace' : 'Upload';
  if (!s) {
    $('#name').textContent = 'No track yet';
    $('#meta').textContent = 'Drop an audio or video file here, or upload one. Every visualizer opens with it.';
  } else {
    $('#name').textContent = s.name.replace(/\.[a-z0-9]+$/i, '');
    $('#meta').textContent = fmtSize(s.size);
    url = URL.createObjectURL(s.blob); audio.src = url;
    audio.onloadedmetadata = () => { $('#meta').textContent = `${fmtTime(audio.duration)} · ${fmtSize(s.size)} · ready for every visualizer`; };
  }
  renderLibrary();
}

const take = f => { if (f) AugenSource.set(f, f.name); };
$('#upload').onclick = () => $('#file').click();
$('#file').onchange = e => { take(e.target.files[0]); e.target.value = ''; };
$('#clear').onclick = () => AugenSource.clear();
$('#preview').onclick = () => {
  if (audio.paused) { audio.play(); $('#preview').classList.add('on'); $('#preview').textContent = 'Stop'; }
  else { audio.pause(); audio.currentTime = 0; $('#preview').classList.remove('on'); $('#preview').textContent = 'Preview'; }
};
audio.onended = () => { $('#preview').classList.remove('on'); $('#preview').textContent = 'Preview'; };

// the whole page is a drop target, the source panel lights up
addEventListener('dragover', e => { e.preventDefault(); $('#drop').classList.add('over'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('#drop').classList.remove('over'); });
addEventListener('drop', e => { e.preventDefault(); $('#drop').classList.remove('over'); take(e.dataTransfer.files[0]); });

AugenSource.onChange(show);
renderGrid();
AugenSource.get().then(show);
</script>
</body>
</html>
