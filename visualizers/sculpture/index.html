<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sculpture Machine</title>
<style>
  :root { --ink:#f3ecd8; --panel:rgba(14,12,10,.78); --line:rgba(243,236,216,.2); --accent:#f6cf1d; }
  html,body { margin:0; height:100%; background:#0c0a08; overflow:hidden; color:var(--ink);
    font:13px/1.3 Futura,"Avenir Next","Helvetica Neue",Arial,sans-serif; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:pointer; object-fit:contain; }
  body.idle canvas#view { cursor:none; }
  .ui { position:fixed; left:16px; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; transition:opacity .5s; }
  body.idle .ui, body.idle .intro { opacity:0; pointer-events:none; }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  button,select { font:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink);
    background:transparent; border:1px solid var(--line); border-radius:4px; padding:6px 10px; cursor:pointer; }
  select option { background:#1a1714; }
  button:hover,select:hover { border-color:var(--ink); }
  button.on { background:var(--ink); color:#0c0a08; }
  #seek { flex:1; min-width:120px; accent-color:var(--accent); }
  .time { font-variant-numeric:tabular-nums; opacity:.7; min-width:92px; text-align:right; font-size:12px; }
  .settings { display:none; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 18px; max-height:52vh; overflow:auto; }
  .settings.open { display:grid; }
  .settings label { display:flex; flex-direction:column; gap:4px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; }
  .settings input[type=range] { accent-color:var(--accent); width:100%; }
  .settings label.check { flex-direction:row; align-items:center; gap:8px; }
  .swatches { display:flex; flex-wrap:wrap; gap:4px; }
  .swatches i { width:16px; height:16px; border-radius:3px; border:1px solid var(--line); opacity:.55; }
  .swatches i.used { opacity:1; outline:1.5px solid var(--ink); outline-offset:1px; }
  #exporting { display:none; position:fixed; left:50%; bottom:24px; transform:translateX(-50%); width:min(420px, calc(100% - 32px));
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; box-sizing:border-box;
    flex-direction:column; gap:8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  #exporting .track { height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  #exp-bar { height:100%; width:0; background:var(--accent); }
  body.exporting #exporting { display:flex; }
  body.exporting .ui, body.exporting .intro { display:none; }
  .hint { font-size:10px; letter-spacing:.1em; text-transform:uppercase; opacity:.45; grid-column:1/-1; }
  .drop { position:fixed; inset:12px; border:3px dashed var(--accent); border-radius:10px; display:none; pointer-events:none; }
  body.dragging .drop { display:block; }
  .intro { position:fixed; top:16px; left:50%; transform:translateX(-50%); max-width:calc(100% - 32px); box-sizing:border-box;
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 14px; font-size:10px;
    letter-spacing:.16em; text-transform:uppercase; text-align:center; transition:opacity .5s; pointer-events:none; }
  body.loaded .intro { display:none; }
  @media (max-width:640px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="drop"></div>
<div class="intro" id="intro">Drop a song, or press Load: drums build the sculpture, notes carve it</div>
<div class="ui">
  <div class="settings bar" id="exportPanel">
    <label>Size<select id="exp-size"><option value="1080p">1920 × 1080</option><option value="720p">1280 × 720</option><option value="square">1080 × 1080 square</option><option value="vertical">1080 × 1920 vertical</option><option value="4k">3840 × 2160</option></select></label>
    <label>Length<select id="exp-len"><option value="full">Whole song</option><option value="clip">30 s from the playhead</option></select></label>
    <label>File size<select id="exp-q"><option value="master">Master · largest</option><option value="high">High · about half</option><option value="small">Small · for sharing</option></select></label>
    <label>Silence before &amp; after<select id="exp-pad"><option value="0">None</option><option value="2">2 s</option><option value="5">5 s</option><option value="10">10 s</option></select></label>
    <label><span>&nbsp;</span><button id="exp-go">Render MP4</button></label>
    <div class="hint" id="exp-msg">Renders frame by frame at the film frame rate. The sculpture, camera, colours and film damage come out exactly as the preview shows them.</div>
  </div>
  <div class="settings bar" id="sculptPanel"></div>
  <div class="settings bar" id="cameraPanel"></div>
  <div class="settings bar" id="colourPanel"></div>
  <div class="settings bar" id="filmPanel"></div>
  <div class="bar">
    <button id="load">Load</button>
    <button id="play">Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="look" title="Look (1–7)">
      <option value="auto">Auto</option>
      <option value="cutpaper">Cut paper</option>
      <option value="toon">Toon</option>
      <option value="clay">Clay</option>
      <option value="halftone">Halftone</option>
      <option value="lines">Lines</option>
      <option value="scratch">Scratch</option>
    </select>
    <button id="sculptBtn">Sculpt</button>
    <button id="cameraBtn" class="hide-sm">Camera</button>
    <button id="colourBtn">Colour</button>
    <button id="filmBtn">Film</button>
    <button id="exportBtn">Export</button>
    <button id="fs" class="hide-sm">Full</button>
  </div>
</div>
<input type="file" id="file" accept="audio/*,video/*" hidden>
<div id="exporting"><div id="exp-text">rendering…</div><div class="track"><div id="exp-bar"></div></div><button id="exp-cancel">Cancel</button></div>

const exportName = lengthKey => `${A.name || 'sculpture'} sculpture${lengthKey === 'clip' ? ' (clip)' : ''}.mp4`;
// file: a FileSystemFileHandle to stream into (memory stays flat at any size); without one the video is built in memory
async function exportMP4(sizeKey, lengthKey, file) {
  if (!A.buffer || EXPORT || !GLOK) return;
  if (!window.VideoEncoder || !window.Mp4Muxer) return setExportMsg('MP4 export needs a recent Chrome, Edge or Safari.');
  initAudio(); pause();
  const [w, h] = SIZES[sizeKey], fps = S.fps, sr = 48000, ch = Math.min(2, A.buffer.numberOfChannels);
  const songStart = lengthKey === 'clip' ? A.offset : 0;
  const songDur = lengthKey === 'clip' ? Math.min(30, A.buffer.duration - songStart) : A.buffer.duration;
  // silent padding: the empty turntable before the music, the finished piece turning after it
  const pad = +S.pad || 0, start = songStart - pad, dur = songDur + 2 * pad;
  const codecs = await pickCodecs(w, h, fps, sr, ch);
  if (!codecs.video) return setExportMsg('This browser cannot encode H.264 at that size.');
  // some browsers and embedded views hand back a file but refuse to write it: render in memory and download instead
  let stream = null;
  if (file) try { stream = await file.createWritable(); } catch (e) { console.warn('cannot write the chosen file, downloading instead', e); file = null; }
  const target = stream ? new Mp4Muxer.FileSystemWritableFileStreamTarget(stream) : new Mp4Muxer.ArrayBufferTarget();
  const muxer = new Mp4Muxer.Muxer({ target, fastStart:stream ? false : 'in-memory', firstTimestampBehavior:'offset',
    video:{ codec:'avc', width:w, height:h, frameRate:fps },
    audio:codecs.audio ? { codec:codecs.audioMux, numberOfChannels:ch, sampleRate:sr } : undefined });
  let failed = null;
  const ve = new VideoEncoder({ output:(c, m) => muxer.addVideoChunk(c, m), error:e => { failed = e; } });
  ve.configure(codecs.video);
  EXPORT = { cancel:false, t0:performance.now() };
  document.body.classList.add('exporting');
  setSizes(w, h, w, h, resScale()); BK.baked = 0;
  let saved = false;
  const total = Math.max(1, Math.floor(dur * fps)), f0 = frameOf(start);
  try {
    for (let i = 0; i < total; i++) {
      const fi = f0 + i;
      render(fi / fps, fi, true);
      const vf = new VideoFrame(view, { timestamp:Math.round(i * 1e6 / fps), duration:Math.round(1e6 / fps) });
      ve.encode(vf, { keyFrame:i % (fps * 2) === 0 }); vf.close();
      while (ve.encodeQueueSize > 4) await yieldNow();
      if (i % 4 === 0) { showProgress(i / total); await yieldNow(); }
      if (failed) throw failed;
      if (EXPORT.cancel) throw new Error('cancelled');
      if (gl.isContextLost()) throw new Error('the graphics card reset (try a smaller size or lower resolution)');
    }
    setExportMsg('finishing…');
    await ve.flush();
    if (codecs.audio) {
      const oc = new OfflineAudioContext(ch, Math.ceil(dur * sr), sr), src = oc.createBufferSource();
      src.buffer = A.buffer; src.connect(oc.destination); src.start(pad, songStart, songDur);
      const rendered = await oc.startRendering();
      const ae = new AudioEncoder({ output:(c, m) => muxer.addAudioChunk(c, m), error:e => { failed = e; } });
      ae.configure(codecs.audio); encodeAudio(rendered, ae); await ae.flush(); ae.close();
    }
    if (failed) throw failed;
    muxer.finalize();
    if (stream) { await stream.close(); saved = true; setExportMsg(`saved ${file.name}`); }
    else {
      const a = document.createElement('a'), blob = new Blob([target.buffer], { type:'video/mp4' });
      target.buffer = null;
      a.href = URL.createObjectURL(blob); a.download = exportName(lengthKey); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      setExportMsg(`saved ${a.download} · ${(blob.size / 1048576).toFixed(0)} MB`);
    }
  } catch (e) {
    setExportMsg(e.message === 'cancelled' ? 'export cancelled' : 'export failed: ' + e.message);
    console.error(e);
  } finally {
    try { ve.close(); } catch (e) {}
    if (stream && !saved) try { await stream.abort(); } catch (e) {}
    EXPORT = null; document.body.classList.remove('exporting');
    BK.baked = 0; resize(); A.offset = songStart; dirty = true;
  }
}
function showProgress(p) {
  const el = (performance.now() - EXPORT.t0) / 1000, eta = p > .01 ? el / p - el : 0;
  $('#exp-bar').style.width = `${(p * 100).toFixed(1)}%`;
  $('#exp-text').textContent = `rendering ${(p * 100).toFixed(0)}%${p > .02 ? ` · about ${fmt(eta)} left` : ''}`;
}
function setExportMsg(m) { $('#exp-text').textContent = m; $('#exp-msg').textContent = m; }

/* ------------------------------------------------------------------ UI */
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let statusMsg = '';
function setStatus(m) { statusMsg = m; if (m) $('#time').textContent = m; }
function updateUI() { $('#play').textContent = A.playing ? 'Pause' : 'Play'; $('#look').value = S.look; }
function togglePlay() { if (EXPORT) return; initAudio(); if (!A.buffer) return $('#file').click(); A.playing ? pause() : play(); }

function addSlider(parent, k, label, after) {
  const l = document.createElement('label'); l.innerHTML = `<span>${label}</span><input type="range" min="0" max="1" step="0.01" value="${S[k]}">`;
  l.querySelector('input').oninput = e => { S[k] = +e.target.value; saveSettings(); after ? after() : (dirty = true); }; parent.appendChild(l);
  return l;
}
function addSelect(parent, k, label, opts, after) {
  const l = document.createElement('label');
  l.innerHTML = `<span>${label}</span><select>${opts.map(([v, txt]) => `<option value="${v}">${txt}</option>`).join('')}</select>`;
  const s = l.querySelector('select'); s.value = String(S[k]);
  s.onchange = () => { S[k] = typeof S[k] === 'number' ? +s.value : s.value; saveSettings(); after ? after() : (dirty = true); };
  parent.appendChild(l); return l;
}
function addCheck(parent, k, label, after) {
  const c = document.createElement('label'); c.className = 'check';
  c.innerHTML = `<input type="checkbox" ${S[k] ? 'checked' : ''}> ${label}`;
  c.querySelector('input').onchange = e => { S[k] = e.target.checked; saveSettings(); after ? after() : (dirty = true); }; parent.appendChild(c);
  return c;
}
function addHint(parent, text) { const h = document.createElement('div'); h.className = 'hint'; h.textContent = text; parent.appendChild(h); return h; }
const geom = () => schedule(3), colour = () => schedule(2), camera = () => schedule(1);

// sculpt
const sp = $('#sculptPanel');
const seedBox = document.createElement('label');
seedBox.innerHTML = `<span>Seed <b id="seedNo"></b></span><button>New seed</button>`;
seedBox.querySelector('button').onclick = () => reseed(); sp.appendChild(seedBox);
function reseed() { S.seed = hashInt(S.seed, 99) % 99999 + 1; saveSettings(); $('#seedNo').textContent = S.seed; geom(); }
addSelect(sp, 'carve', 'Carving', [['pitch', 'Notes drill in'], ['hats', 'Hi-hats punch holes'], ['offbeat', 'Offbeats bore'], ['chords', 'Chord changes chisel'], ['inverse', 'Inverse: notes add, drums carve']], geom);
addSelect(sp, 'shapes', 'Pieces', [['mixed', 'Mixed, by band'], ['blocks', 'Blocks'], ['spheres', 'Spheres'], ['rods', 'Rods']], geom);
addSlider(sp, 'growth', 'Growth: sparse ↔ dense', geom);
addSlider(sp, 'size', 'Piece size', geom);
addSlider(sp, 'embed', 'Perched ↔ buried', geom);
addSlider(sp, 'melt', 'Hard edges ↔ melted', geom);
addSlider(sp, 'mass', 'Mass budget: airy ↔ solid', geom);
addSlider(sp, 'pitchSens', 'Pitch sensitivity', geom);
addSelect(sp, 'symmetry', 'Symmetry', [['none', 'None'], ['mirror', 'Mirror'], ['3', '3-fold'], ['4', '4-fold'], ['5', '5-fold'], ['6', '6-fold'], ['8', '8-fold']], geom);
addSelect(sp, 'orient', 'Orientation', [['aligned', 'Squared up'], ['normal', 'Follow the surface'], ['tumbled', 'Tumbled, 45° steps']], geom);
addSelect(sp, 'detail', 'Baked detail', [['96', '96³ · fast'], ['128', '128³'], ['160', '160³'], ['192', '192³ · fine']], () => { if (GLOK) allocVolume(); dirty = true; });
addCheck(sp, 'stack', 'Stack under gravity', geom);
const stats = addHint(sp, '');
function showStats() {
  $('#seedNo').textContent = S.seed;
  stats.textContent = `${PRIMS.length} pieces · ${SIM.nAdd} built · ${SIM.nSub} carved · mass ${(SIM.mass * 100) | 0}%` + (AN && !AN.demo ? ` · ${AN.bpm.toFixed(0)} bpm · ${AN.sections.length} sections` : ' · demo pattern');
}

// camera
const cp = $('#cameraPanel');
addSelect(cp, 'turn', 'Turntable', [['stop', 'Steady turn'], ['ratchet', 'Ratchet on the beat'], ['loud', 'Speed follows loudness'], ['pingpong', 'Rock back and forth'], ['still', 'Still']], camera);
addSlider(cp, 'turnSpeed', 'Turn speed', camera);
addSlider(cp, 'dist', 'Distance');
addSlider(cp, 'elev', 'Low ↔ overhead');
addSlider(cp, 'fov', 'Lens: long ↔ wide');
addSlider(cp, 'punch', 'Kick punch-in');
addSlider(cp, 'follow', 'Glance at new pieces');
addSelect(cp, 'shots', 'Shots', [['music', 'Follow the song (cut on its changes)'], ['off', 'One shot per section'], ['1', 'New shot every bar'], ['2', 'Every 2 bars'], ['4', 'Every 4 bars'], ['8', 'Every 8 bars'], ['16', 'Every 16 bars']], camera);
addSlider(cp, 'shotSens', 'Shot sensitivity: big changes only ↔ more cuts', camera);
addSelect(cp, 'cuts', 'Between shots', [['splice', 'Splice cut'], ['clean', 'Clean cut'], ['glide', 'Glide']], camera);
addCheck(cp, 'dolly', 'Dolly-zoom on kicks');

// colour
const kp = $('#colourPanel');
const palLabel = addSlider(kp, 'variety', '', colour);
addSlider(kp, 'colourRate', 'Colour changes: rare ↔ every bar', colour);
addSelect(kp, 'bgChange', 'Ground colour changes', [['sections', 'At new sections'], ['never', 'Never'], ['colours', 'With every colour change']], colour);
addSelect(kp, 'cut', 'Carved faces', [['accent', 'Contrasting colour'], ['cream', 'Cream'], ['black', 'Black'], ['ground', 'Ground colour']], colour);
addSelect(kp, 'ink', 'Ink', [['auto', 'Black or cream'], ['black', 'Black'], ['cream', 'Cream'], ['none', 'None']]);
addSlider(kp, 'inkW', 'Ink weight');
addSelect(kp, 'ground', 'Ground', [['plinth', 'Turntable'], ['shadow', 'Shadow only'], ['void', 'Nothing']]);
addCheck(kp, 'shadows', 'Cast shadows');
const swatchBox = document.createElement('label');
swatchBox.innerHTML = `<span>Colours at the playhead</span><div class="swatches"></div>`; kp.appendChild(swatchBox);
const shuffle = document.createElement('button'); shuffle.textContent = 'Shuffle colours';
shuffle.onclick = () => { S.palShuffle++; saveSettings(); rebuildColour(); }; kp.appendChild(shuffle);
function showSwatches() {
  palLabel.querySelector('span').textContent = `Palette: ${tierOf(S.variety).name}`;
  if (!PALS.length) return;
  const P = palAt(A.buffer ? curTime() : 0);
  swatchBox.querySelector('.swatches').innerHTML = P.theme.map(c => `<i style="background:${c}" class="${[P.bg, P.band, P.barCol, P.cutAccent].includes(c) ? 'used' : ''}"></i>`).join('');
}
setInterval(() => { if (kp.classList.contains('open')) showSwatches(); }, 500);

// film
const fp = $('#filmPanel');
for (const [k, label] of [['saturation','Film stock: B&W ↔ Saturated'], ['warmth','Cool ↔ Warm'], ['grain','Grain'], ['flicker','Shutter flicker'],
  ['dust','Dust & specks'], ['scratch','Scratches & hairs'], ['weave','Gate weave'], ['boil','Hand-made boil'], ['vignette','Vignette'], ['chroma','Colour fringe'], ['halation','Halation']]) addSlider(fp, k, label);
addSelect(fp, 'fps', 'Frame rate', [['12', '12 · on twos'], ['24', '24 · film'], ['30', '30'], ['60', '60 · smooth']]);
addSlider(fp, 'quality', 'Resolution: chunky pixels ↔ full', resize);
addCheck(fp, 'edge', 'Show film edge');
addCheck(fp, 'splices', 'Splice cuts (flash + frame roll)');
addHint(fp, 'space play · 1–7 looks · ← → seek · r new seed · e export · f fullscreen · h hide controls · drop a file anywhere');

const PANELS = [['#sculptBtn', '#sculptPanel'], ['#cameraBtn', '#cameraPanel'], ['#colourBtn', '#colourPanel'], ['#filmBtn', '#filmPanel'], ['#exportBtn', '#exportPanel']];
function togglePanel(btn, panel) {
  const open = !$(panel).classList.contains('open');
  for (const [b, p] of PANELS) { $(b).classList.remove('on'); $(p).classList.remove('open'); }
  if (open) { $(btn).classList.add('on'); $(panel).classList.add('open'); if (panel === '#colourPanel') showSwatches(); }
}
for (const [b, p] of PANELS) $(b).onclick = () => togglePanel(b, p);

$('#load').onclick = () => { initAudio(); $('#file').click(); };
$('#file').onchange = async e => { const f = e.target.files[0]; if (f) loadArrayBuffer(await f.arrayBuffer(), f.name); e.target.value = ''; };
$('#play').onclick = togglePlay;
view.onclick = togglePlay;
$('#look').onchange = e => { S.look = e.target.value; saveSettings(); dirty = true; };
$('#exp-go').onclick = async () => {
  if (!A.buffer || EXPORT) return;
  const len = $('#exp-len').value; let file = null;
  // ask where to save first, so the video can stream straight to disk while it renders
  if (window.showSaveFilePicker) {
    try { file = await showSaveFilePicker({ suggestedName:exportName(len), types:[{ description:'MP4 video', accept:{ 'video/mp4':['.mp4'] } }] }); }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  exportMP4($('#exp-size').value, len, file);
};
$('#exp-pad').value = String(S.pad);
$('#exp-q').value = S.expQ;
$('#exp-q').onchange = e => { S.expQ = e.target.value; saveSettings(); };
$('#exp-pad').onchange = e => { S.pad = +e.target.value; saveSettings(); };
$('#exp-cancel').onclick = () => { if (EXPORT) EXPORT.cancel = true; };
$('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
let seeking = false;
$('#seek').oninput = () => { seeking = true; };
$('#seek').onchange = e => { seeking = false; if (A.buffer) seek(e.target.value / 1000 * A.buffer.duration); };

addEventListener('keydown', e => {
  if (EXPORT) return;
  if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
  const looks = ['auto', ...LOOKS];
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key >= '1' && e.key <= '7') { S.look = looks[+e.key - 1]; saveSettings(); updateUI(); dirty = true; }
  else if (e.key === 'ArrowRight') seek(curTime() + 5);
  else if (e.key === 'ArrowLeft') seek(curTime() - 5);
  else if (e.key === 'r') reseed();
  else if (e.key === 'e') togglePanel('#exportBtn', '#exportPanel');
  else if (e.key === 'f') $('#fs').click();
  else if (e.key === 'h') document.body.classList.toggle('idle');
});
let idleTimer;
addEventListener('pointermove', () => {
  document.body.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (A.playing) document.body.classList.add('idle'); }, 2500);
});
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('dragging'); initAudio();
  const f = e.dataTransfer.files[0]; if (f) loadArrayBuffer(await f.arrayBuffer(), f.name);
});
addEventListener('resize', resize);
view.addEventListener('webglcontextlost', e => { e.preventDefault(); setStatus('graphics card reset: reload the page'); });

/* ------------------------------------------------------------------ start */
AN = fakeAnalysis();
if (!GLOK) { setStatus('needs WebGL2 with float render targets'); $('#intro').textContent = 'This browser cannot run the raymarcher. Try desktop Chrome or Edge.'; }
else {
  try { initGL(); } catch (e) { console.error(e); setStatus('shader error, see console'); }
  resize(); rebuildAll(); updateUI(); requestAnimationFrame(loop);
}
// ?src=song.m4a preloads a file when served over http (still needs a click to start the sound)
const qs = new URLSearchParams(location.search).get('src');
if (qs) fetch(qs).then(r => r.arrayBuffer()).then(ab => loadArrayBuffer(ab, qs, false)).catch(() => setStatus('could not load ' + qs));
window.sculpt = { A, S, SIM, BK, get AN() { return AN; }, get PRIMS() { return PRIMS; }, get SHOTS() { return SHOTS; }, buildCameraPlan, seek, play, pause, exportMP4, rebuildAll, render };
