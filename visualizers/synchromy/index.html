<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synchromy Machine</title>
<style>
  :root { --ink:#f3ecd8; --panel:rgba(14,12,10,.78); --line:rgba(243,236,216,.2); --accent:#f6cf1d; }
  html,body { margin:0; height:100%; background:#0c0a08; overflow:hidden; color:var(--ink);
    font:13px/1.3 Futura,"Avenir Next","Helvetica Neue",Arial,sans-serif; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  body.idle canvas#view { cursor:none; }
  .ui { position:fixed; left:16px; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; transition:opacity .5s; }
  body.idle .ui { opacity:0; pointer-events:none; }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  button,select { font:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink);
    background:transparent; border:1px solid var(--line); border-radius:4px; padding:6px 10px; cursor:pointer; }
  select option { background:#1a1714; }
  button:hover,select:hover { border-color:var(--ink); }
  button.on { background:var(--ink); color:#0c0a08; }
  button.rec.on { background:#e3262f; border-color:#e3262f; color:#fff; }
  #seek { flex:1; min-width:120px; accent-color:var(--accent); }
  .time { font-variant-numeric:tabular-nums; opacity:.7; min-width:92px; text-align:right; font-size:12px; }
  .settings { display:none; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 18px; }
  .settings.open { display:grid; }
  .settings label { display:flex; flex-direction:column; gap:4px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; }
  .settings input[type=range] { accent-color:var(--accent); width:100%; }
  .settings label.check { flex-direction:row; align-items:center; gap:8px; }
  .bgrow { display:flex; gap:6px; align-items:center; }
  .bgrow select { flex:1; }
  .bgrow input[type=color] { width:34px; height:28px; padding:0; border:1px solid var(--line); border-radius:4px; background:none; }
  .bgrow input[hidden] { display:none; }
  .swatches { display:flex; flex-wrap:wrap; gap:4px; }
  .swatches i { width:16px; height:16px; border-radius:3px; border:1px solid var(--line); opacity:.55; }
  .swatches i.used { opacity:1; outline:1.5px solid var(--ink); outline-offset:1px; }
  canvas#view { object-fit:contain; }
  #exporting { display:none; position:fixed; left:50%; bottom:24px; transform:translateX(-50%); width:min(420px, calc(100% - 32px));
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; box-sizing:border-box;
    flex-direction:column; gap:8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  #exporting .track { height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  #exp-bar { height:100%; width:0; background:var(--accent); }
  body.exporting #exporting { display:flex; }
  body.exporting .ui { display:none; }
  .hint { font-size:10px; letter-spacing:.1em; text-transform:uppercase; opacity:.45; grid-column:1/-1; }
  .drop { position:fixed; inset:12px; border:3px dashed var(--accent); border-radius:10px; display:none; pointer-events:none; }
  body.dragging .drop { display:block; }
  @media (max-width:640px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="drop"></div>
<div class="ui">
  <div class="settings bar" id="exportPanel">
    <label>Size<select id="exp-size"><option value="1080p">1920 × 1080</option><option value="720p">1280 × 720</option><option value="square">1080 × 1080 square</option><option value="vertical">1080 × 1920 vertical</option></select></label>
    <label>Length<select id="exp-len"><option value="full">Whole song</option><option value="clip">30 s from the playhead</option></select></label>
    <label>File size<select id="exp-q"><option value="master">Master · largest</option><option value="high">High · about half</option><option value="small">Small · for sharing</option></select></label>
    <label>Silence before &amp; after<select id="exp-pad"><option value="0">None</option><option value="2">2 s</option><option value="5">5 s</option><option value="10">10 s</option></select></label>
    <label><span>&nbsp;</span><button id="exp-go">Render MP4</button></label>
    <div class="hint" id="exp-msg">Renders frame by frame with your current mode, colour and film settings, at the film frame rate. Takes about as long as the song or less.</div>
  </div>
  <div class="settings bar" id="colour"></div>
  <div class="settings bar" id="settings"></div>
  <div class="bar">
    <button id="load">Load</button>
    <button id="play">Play</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <select id="mode" title="Mode (1–6)">
      <option value="auto">Auto</option>
      <option value="synchromy">Synchromy</option>
      <option value="optical">Optical track</option>
      <option value="dullcare">Dull Care</option>
      <option value="rows">Rows</option>
      <option value="rings">Rings</option>
    </select>
    <button id="mic" class="hide-sm">Mic</button>
    <button id="rec" class="rec hide-sm">Rec</button>
    <button id="palette">Colour</button>
    <button id="export">Export</button>
    <button id="gear">Film</button>
    <button id="fs" class="hide-sm">Full</button>
  </div>
</div>
<input type="file" id="file" accept="audio/*,video/*" hidden>
<div id="exporting"><div id="exp-text">rendering…</div><div class="track"><div id="exp-bar"></div></div><button id="exp-cancel">Cancel</button></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const rand = Math.random;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[(rand() * arr.length) | 0];

/* ------------------------------------------------------------------ settings */
const S = { mode:'auto', saturation:.5, warmth:.5, variety:.6, colourRate:.6, bgMode:'auto', bgCustom:'#1d3e9e', fps:24, grain:.55, flicker:.45, dust:.5, scratch:.5, splices:true, weave:.4, boil:.5, vignette:.55, chroma:.35, halation:.35, edge:false, quality:1, bgChange:'sections', expQ:'high', pad:5, cutSens:.5 };
try { Object.assign(S, JSON.parse(localStorage.getItem('synchromy-settings') || '{}')); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem('synchromy-settings', JSON.stringify(S)); } catch (e) {} };

/* ------------------------------------------------------------------ canvases */
const view = $('#view');
const gl = view.getContext('webgl', { antialias:false, premultipliedAlpha:false });
const view2d = gl ? null : view.getContext('2d');
const scene = document.createElement('canvas'), g = scene.getContext('2d');
const paint = document.createElement('canvas'), pg = paint.getContext('2d');
let W = 0, H = 0, U = 1; // U = scale unit relative to 1280px wide

// resolution is a fraction of the frame, so a chunky preview exports just as chunky at any size
const resScale = () => lerp(.06, 1, S.quality * S.quality);
function setCanvasSize(vw, vh, sw, sh) {
  const q = resScale(); sw = Math.max(2, Math.round(sw * q)); sh = Math.max(2, Math.round(sh * q));
  view.width = vw; view.height = vh; W = sw; H = sh;
  scene.width = paint.width = W; scene.height = paint.height = H; U = Math.max(W, H * .8) / 1280;
  pg.fillStyle = V.bg; pg.fillRect(0, 0, W, H);
}
function resize() {
  if (EXPORT) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), sw = Math.round(Math.min(innerWidth * dpr, 1600));
  setCanvasSize((innerWidth * dpr) | 0, (innerHeight * dpr) | 0, sw, Math.round(sw * innerHeight / innerWidth));
}

/* ------------------------------------------------------------------ palette (McLaren-ish flat poster colours) */
const PAL = ['#e3262f','#f6cf1d','#1d3e9e','#f2701f','#2aa84a','#d81b7b','#1aa3c8','#6b2d90','#121015','#f3ecd8','#a3d13b','#ff8fb1','#0f6b5c'];

const NEUTRALS = ['#121015', '#f3ecd8'];

// the palette ladder, one notch at a time:

  { name:'greyscale', greys:true },
  { name:'greyscale + 1 accent, sometimes', greys:true, accents:1 },
  { name:'greyscale + 2 accents, sometimes', greys:true, accents:2 },
  { name:'greyscale, always 1 accent', greys:true, accents:1, always:true },
  { name:'greyscale, always 2 accents', greys:true, accents:2, always:true },
  ...Array.from({ length:WHEEL.length - 1 }, (_, i) => ({ name:i + 2 === WHEEL.length ? 'every poster colour' : `${i + 2} neighbouring hues`, hues:i + 2 })),
  { name:'anything goes', hues:WHEEL.length, extra:true },

const tierOf = v => TIERS[Math.min(TIERS.length - 1, Math.floor(v * TIERS.length))];

}

// background override from the Colour panel; Auto lets the palette choose
const fixedBg = () => ({ black:'#121015', white:'#f3ecd8', grey:'#8a857b', custom:S.bgCustom }[S.bgMode] || null);
// keepGround: the background and divider band hold, only the bar colours move

    const bands = bandPool.filter(c => c !== V.bg && contrast(c, V.bg) > 1.2);

  for (let i = 0; i < 5; i++) cols.push(useAccent ? V.accents[i % V.accents.length] : colourAgainst(V.bg, i ? [cols[i-1], V.band] : [V.band]));

// a "scheme" is one look from the film: how many soundtrack strips, how they are cut and magnified,
// which side of the divider band they hang off, and whether low pitches sit left and high pitches right
function newScheme() {
  const sc = {
    layout:pick(['mirror', 'mirror', 'spectrum', 'spectrum', 'split', 'unison']),
    attach:pick(['behind', 'behind', 'left', 'right', 'both', 'free']),
    bandW:pick([0, .16, .28, .4]),
    crop:rand() < .4,
    unified:rand() < .85 - .6 * S.variety,
    zoom:pick([.12, .25, .45, .7, 1, 1, 1.4]),
    flip:rand() < .5,
    rim:rand() < .75,
    radius:pick([0, .1, .22]),
    divide:rand() < .25 ? pick([2, 3]) : 1,
    square:rand() < .2,
    rowSquare:rand() < .6,

  if (sc.attach === 'free') sc.bandW = 0;

/* ------------------------------------------------------------------ visual state */
const V = { bg:'#121015', cols:['#f6cf1d','#e3262f','#1aa3c8','#f3ecd8','#d81b7b'], nCols:1, lastColChange:0,
  curMode:'optical', punch:0, flash:0, roll:0, splice:0, spliceY:0, title:1, sectionIdx:-1,
  scratches:[], hairs:[], dcLines:[], weave:[0,0], flick:1 };

/* ------------------------------------------------------------------ audio */
const A = { ctx:null, buffer:null, src:null, t0:0, offset:0, playing:false, mic:null, micStream:null, name:'',
  env:null, envRate:20, envMax:1, sections:[0], sectionModes:['synchromy'] };

// full-spectrum analyser plus three filtered ones for the waveform tracks (also rebuilt offline for export)

    const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q;
    const a = ctx.createAnalyser(); a.fftSize = 4096; input.connect(b); b.connect(a);

  A.time = new Float32Array(A.an.fftSize);
}

const cleanName = n => n.split('/').pop().replace(/\.[a-z0-9]+$/i,'').replace(/[_]+/g,' ').replace(/\s+\.\d+$/,'').trim();

async function loadArrayBuffer(ab, name, autoplay = true) {
  initAudio(); stopMic(); pause();
  setStatus('decoding…');
  const buf = await A.ctx.decodeAudioData(ab);
  A.buffer = buf; A.name = cleanName(name); A.offset = 0;
  analyseEnvelope(buf);
  V.sectionIdx = -1; V.nCols = 1; newPalette(); newScheme();
  setStatus('');
  if (autoplay) play();
  updateUI();
}

/* ------------------------------------------------------------------ analysis */
const F = { flux:0, fm:0, fv:1, lm:0, lv:1, lastOnset:0, lastCut:0, loud:0, rms:0, runPeak:.02 };
const VOICES = [

  { name:'bass',    lo:40,   hi:220,   hps:3 },
  { name:'harmony', lo:500,  hi:2600,  hps:2 },
  { name:'air',     lo:3000, hi:11000, hps:0 },
  { name:'octave' },

function voicePitch(v, binHz, N) {

function analyse(now) {

/* ------------------------------------------------------------------ renderers */
// with two accents in play they alternate strip by strip, so both are always on screen together

const LOW_TO_HIGH = [1, 0, 4, 2, 3]; // bass, melody, octave, harmony, air

// Rows: the same soundtrack cards turned on their side, blocks pushed towards squares

// Rings: the soundtrack wrapped around the centre. Rings run low → high outwards (or inwards when flipped),

  const sides = sc.attach === 'left' ? [-1] : sc.attach === 'right' ? [1] : sc.attach === 'both' ? [-1, 1] : [0];

function paintBlob(x = rand() * W, y = rand() * H, r = (60 + rand() * 160) * U * (.5 + F.loud)) {

    const step = 18 * U, j = () => (rand() - .5) * (3 + S.boil * 8) * U;

    g.lineWidth = l.w; g.beginPath();
    if (l.horiz) { for (let x = 0; x <= W; x += 14 * U) { const y = l.y + (rand() - .5) * 6 * U; x ? g.lineTo(x, y) : g.moveTo(x, y); } }
    else { l.x += (rand() - .5) * 10 * U; for (let y = 0; y <= H; y += 14 * U) { const x = l.x + (rand() - .5) * 6 * U; y ? g.lineTo(x, y) : g.moveTo(x, y); } }
    g.stroke();
  }
}


/* ------------------------------------------------------------------ film damage (drawn into the scene) */
function filmDamage() {
  const d = S.dust;
  // dust specks
  for (let i = 0, n = (rand() * d * 7) | 0; i < n; i++) {
    g.fillStyle = rand() < .75 ? 'rgba(10,8,6,.85)' : 'rgba(255,250,235,.85)';
    const s = (1 + rand() * rand() * 7) * U;
    g.beginPath(); g.ellipse(rand() * W, rand() * H, s, s * (.4 + rand() * .6), rand() * 3, 0, 6.283); g.fill();
  }
  // fibres
  if (rand() < d * .12) {
    g.strokeStyle = rand() < .7 ? 'rgba(10,8,6,.8)' : 'rgba(255,250,235,.7)'; g.lineWidth = (.8 + rand()) * U;
    const x = rand() * W, y = rand() * H, l = (10 + rand() * 40) * U;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + (rand() - .5) * l, y + (rand() - .5) * l, x + (rand() - .5) * l, y + (rand() - .5) * l); g.stroke();
  }
  // long vertical scratches that persist and wander
  if (rand() < S.scratch * .05) V.scratches.push({ x:rand() * W, life:10 + rand() * 60, a:.25 + rand() * .45, w:(.6 + rand() * 1.4) * U, dark:rand() < .25, v:(rand() - .5) * 2 * U });
  V.scratches = V.scratches.filter(s => s.life-- > 0);
  for (const s of V.scratches) {
    s.x += s.v + (rand() - .5) * 1.5 * U;
    g.strokeStyle = s.dark ? `rgba(10,8,6,${s.a})` : `rgba(255,250,235,${s.a})`; g.lineWidth = s.w;
    g.beginPath(); g.moveTo(s.x, 0); g.bezierCurveTo(s.x + 3 * U, H * .3, s.x - 3 * U, H * .7, s.x + (rand() - .5) * 2 * U, H);
    if (rand() > .1) g.stroke(); // flickers in and out
  }
  // a hair caught in the gate
  if (rand() < S.scratch * .006) V.hairs.push({ life:3 + rand() * 8, x:rand() < .5 ? rand() * W * .2 : W - rand() * W * .2, y:rand() * H, s:(40 + rand() * 120) * U, p:rand() * 6 });
  V.hairs = V.hairs.filter(h => h.life-- > 0);
  g.strokeStyle = 'rgba(10,8,6,.9)'; g.lineWidth = 1.4 * U;
  for (const h of V.hairs) {
    h.x += (rand() - .5) * 3 * U;
    g.beginPath(); g.moveTo(h.x, h.y);
    g.bezierCurveTo(h.x + Math.cos(h.p) * h.s, h.y + Math.sin(h.p) * h.s, h.x - Math.sin(h.p) * h.s, h.y + h.s, h.x + h.s * .3, h.y + h.s * 1.3); g.stroke();
  }
  // splice: tape edge and cement line across the frame
  if (V.splice > 0) {
    V.splice--;
    g.fillStyle = 'rgba(255,250,230,.18)'; g.fillRect(0, V.spliceY - 30 * U, W, 60 * U);
    g.fillStyle = 'rgba(10,8,6,.7)'; g.fillRect(0, V.spliceY - 2 * U, W, 4 * U);
  }
  if (S.edge) drawFilmEdge();
  if (V.flash > 0) { g.fillStyle = `rgba(255,252,240,${.85 * V.flash})`; g.fillRect(0, 0, W, H); V.flash = 0; }
}

function drawFilmEdge() {
  const ew = W * .065;
  g.fillStyle = '#0b0907'; g.fillRect(0, 0, ew, H);
  g.fillStyle = '#d9cfb4';
  const ph = H / 4, hh = ew * .3;
  for (let i = 0; i < 5; i++) { const y = i * ph + ph / 2 - hh / 2; g.beginPath(); g.roundRect ? g.roundRect(ew * .12, y, ew * .28, hh, ew * .05) : g.rect(ew * .12, y, ew * .28, hh); g.fill(); }
  // variable-area soundtrack of the full mix
  if (!A.time) return;
  const cx = ew * .72, half = ew * .2, st = triggerStart(A.time, 2400);
  let pk = .02; for (let i = st; i < st + 2400; i += 3) pk = Math.max(pk, Math.abs(A.time[i]));
  g.fillStyle = '#f3ecd8'; g.beginPath();
  const pts = []; for (let y = 0; y <= H; y += 3 * U) pts.push([y, Math.abs(A.time[st + ((y / H * 2400) | 0)]) / pk * half]);
  pts.forEach(([y, w], j) => j ? g.lineTo(cx - w, y) : g.moveTo(cx - w, y));
  for (let j = pts.length - 1; j >= 0; j--) g.lineTo(cx + pts[j][1], pts[j][0]);
  g.fill();
}

/* ------------------------------------------------------------------ WebGL post: grain, flicker, weave, halation, vignette */
const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p * .5 + .5; v.y = 1. - v.y; gl_Position = vec4(p, 0., 1.); }`;
const FS = `
precision highp float;
varying vec2 v;
uniform sampler2D tex; uniform vec2 res, weave;
uniform float seed, grain, gsize, flick, vign, chroma, hal, roll, sat, temp;
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
void main(){
  vec2 uv = v + weave;
  uv.y = fract(uv.y + roll);
  vec2 d = uv - .5; float k = chroma * .012;
  vec3 c = vec3(texture2D(tex, uv + d * k).r, texture2D(tex, uv).g, texture2D(tex, uv - d * k).b);
  if (hal > 0.) {
    vec3 h = vec3(0.);
    for (int i = 0; i < 8; i++) {
      float a = float(i) * .785398; vec2 o = vec2(cos(a), sin(a) * res.x / res.y) * .006;
      h += max(texture2D(tex, uv + o).rgb - .55, 0.) + .6 * max(texture2D(tex, uv + o * 2.4).rgb - .55, 0.);
    }
    c += h / 16. * hal * vec3(1., .45, .3) * 2.4;
  }
  c = mix(c, c * c * (3. - 2. * c), .3);           // print-stock S-curve
  c = c * .93 + .035; c *= vec3(1., .985, .95);    // lifted blacks, warm base
  float L = dot(c, vec3(.299, .587, .114));
  c = clamp(mix(vec3(L), c, sat), 0., 1.);         // 0 = black & white, 1 = as painted, 2 = vivid
  c *= vec3(1. + .16 * temp, 1. + .02 * temp, 1. - .2 * temp); // cool ↔ warm print
  if (abs(roll) > .001) { float fy = v.y + weave.y + roll; float e = abs(fract(fy + .5) - .5); c *= smoothstep(.0, .03, e); }
  vec2 gp = floor(gl_FragCoord.xy / gsize);
  float n = (hash(gp + seed * vec2(17.3, 91.7)) + .7 * hash(floor(gp * .5) + seed * vec2(5.1, 3.3))) / 1.7 - .5;
  float l = dot(c, vec3(.299, .587, .114));
  c += n * grain * .34 * (.4 + 2.2 * l * (1. - l));
  c += (vec3(hash(gp + seed + 1.3), hash(gp + seed + 2.7), hash(gp + seed + 4.1)) - .5) * grain * .05;
  c *= flick;
  vec2 q = (v - .5) * vec2(1.1, 1.25); c *= mix(1., clamp(1. - dot(q, q) * 1.7, 0., 1.), vign);
  gl_FragColor = vec4(clamp(c, 0., 1.), 1.);
}`;
const GU = {};
function initGL() {
  if (!gl) return;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); return o; };
  const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(p); gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  for (const n of ['res','weave','seed','grain','gsize','flick','vign','chroma','hal','roll','sat','temp']) GU[n] = gl.getUniformLocation(p, n);
}
function post() {
  // projector gate weave (random walk with spring) and lamp flicker
  V.weave[0] = V.weave[0] * .85 + (rand() - .5) * .0016 * S.weave;
  V.weave[1] = V.weave[1] * .85 + (rand() - .5) * .0024 * S.weave + (rand() < .01 * S.weave ? (rand() - .5) * .006 : 0);
  V.flick = 1 + (rand() - .5) * .14 * S.flicker + Math.sin(clock() * 13) * .015 * S.flicker + V.punch * .05;
  if (!gl) { view2d.drawImage(scene, 0, 0, view.width, view.height); return; }
  gl.viewport(0, 0, view.width, view.height);
  const filt = resScale() < .99 ? gl.NEAREST : gl.LINEAR;   // chunky resolutions keep hard pixel edges
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, scene);
  gl.uniform2f(GU.res, view.width, view.height); gl.uniform2f(GU.weave, V.weave[0], V.weave[1]);
  gl.uniform1f(GU.seed, rand() * 100); gl.uniform1f(GU.grain, S.grain); gl.uniform1f(GU.gsize, Math.max(1, view.width / 1500));
  gl.uniform1f(GU.flick, V.flick); gl.uniform1f(GU.vign, S.vignette); gl.uniform1f(GU.chroma, S.chroma);
  gl.uniform1f(GU.hal, S.halation); gl.uniform1f(GU.roll, V.roll);
  gl.uniform1f(GU.sat, S.saturation * 2); gl.uniform1f(GU.temp, S.warmth * 2 - 1);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ------------------------------------------------------------------ main loop */
let lastFrame = 0;
function updateSection() {
  // section changes → splice, and in Auto, a change of technique
  if (A.buffer && !A.mic) {
    const t = curTime(); let idx = 0; while (idx + 1 < A.sections.length && A.sections[idx + 1] <= t) idx++;
    if (idx !== V.sectionIdx) { if (V.sectionIdx >= 0 && (A.playing || EXPORT)) { splice(); newScheme(); if (S.bgChange === 'sections') newPalette(); } V.sectionIdx = idx; }
    V.curMode = S.mode === 'auto' ? A.sectionModes[idx] : S.mode;
  } else V.curMode = S.mode === 'auto' ? 'synchromy' : S.mode;
  if (V.curMode !== V.lastMode) { if (V.curMode === 'dullcare') { pg.fillStyle = V.bg; pg.fillRect(0, 0, W, H); } V.lastMode = V.curMode; }
}
function renderFrame(live) {
  ({ optical:drawOptical, dullcare:drawDullCare, rows:drawRows, rings:drawRings }[V.curMode] || drawSynchromy)();
  filmDamage();
  post();
  V.punch *= .82; V.roll *= .62; if (Math.abs(V.roll) < .002) V.roll = 0;
}
function loop(ts) {
  requestAnimationFrame(loop);
  if (EXPORT) return;
  const now = ts / 1000;
  const live = A.ctx && (A.playing || A.mic);
  if (live) analyse(now); else decay();
  updateSection();
  if (now - lastFrame < 1 / S.fps - .004) return;   // step at film frame rate
  lastFrame = now;
  renderFrame(live);
  if (A.buffer && !seeking) { const t = curTime(), d = A.buffer.duration; $('#seek').value = (t / d * 1000) | 0; $('#time').textContent = `${fmt(t)} / ${fmt(d)}`; }
}
/* ------------------------------------------------------------------ MP4 export: frame-exact offline render */
// The song is played through an OfflineAudioContext that pauses at every analysis tick, so each video frame
// sees exactly the audio it will be paired with. Frames go to WebCodecs (H.264), the audio to AAC, both into an MP4.
const SIZES = { '1080p':[1920, 1080], '720p':[1280, 720], 'square':[1080, 1080], 'vertical':[1080, 1920] };

// bits per pixel per frame; the grain is fresh noise every frame, so it is what these mostly pay for
const EXPORT_BPP = { master:.4, high:.2, small:.1 };
async function pickCodecs(w, h, fps, sr, ch) {
  const out = {}, bpp = EXPORT_BPP[S.expQ] || .4;
  const bitrate = Math.round(Math.min(40e6 * bpp / .4, w * h * fps * bpp));
  for (const codec of ['avc1.640033', 'avc1.64002A', 'avc1.640028', 'avc1.4D0033', 'avc1.42E033']) {
    const cfg = { codec, width:w, height:h, bitrate, framerate:fps, avc:{ format:'avc' } };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) { out.video = cfg; break; } } catch (e) {}
  }
  if (window.AudioEncoder) for (const [codec, mux] of [['mp4a.40.2', 'aac'], ['opus', 'opus']]) {
    const cfg = { codec, sampleRate:sr, numberOfChannels:ch, bitrate:256000 };
    try { if ((await AudioEncoder.isConfigSupported(cfg)).supported) { out.audio = cfg; out.audioMux = mux; break; } } catch (e) {}
  }
  return out;
}

function encodeAudio(buf, enc) {
  const ch = buf.numberOfChannels, sr = buf.sampleRate, block = 4096;
  for (let off = 0; off < buf.length; off += block) {
    const n = Math.min(block, buf.length - off), data = new Float32Array(n * ch);
    for (let c = 0; c < ch; c++) data.set(buf.getChannelData(c).subarray(off, off + n), c * n);
    const ad = new AudioData({ format:'f32-planar', sampleRate:sr, numberOfFrames:n, numberOfChannels:ch, timestamp:Math.round(off / sr * 1e6), data });
    enc.encode(ad); ad.close();
  }
}

function resetAnalysis() {
  Object.assign(F, { flux:0, fm:0, fv:1, lm:0, lv:1, lastOnset:-100, lastCut:-100, loud:0, rms:0 });
  for (const v of VOICES) Object.assign(v, { amp:0, peak:1e-5, cnt:0 });
  for (const b of A.bands) b.peak = .02;
  A.prevLog.fill(0); V.lastColChange = -100;
}

const exportName = lengthKey => `${A.name || 'synchromy'}${lengthKey === 'clip' ? ' (clip)' : ''}.mp4`;
// file: a FileSystemFileHandle to stream into (memory stays flat at any size); without one the video is built in memory
async function exportMP4(sizeKey, lengthKey, file) {
  if (!A.buffer || EXPORT) return;
  if (!window.VideoEncoder || !window.Mp4Muxer) return setExportMsg('MP4 export needs a recent Chrome, Edge or Safari.');
  initAudio(); pause(); stopMic();
  const [w, h] = SIZES[sizeKey], fps = S.fps, sr = 48000, ch = Math.min(2, A.buffer.numberOfChannels);
  const start = lengthKey === 'clip' ? A.offset : 0;
  const dur = lengthKey === 'clip' ? Math.min(30, A.buffer.duration - start) : A.buffer.duration;
  const codecs = await pickCodecs(w, h, fps, sr, ch);
  if (!codecs.video) return setExportMsg('This browser cannot encode H.264 at that size.');

  // silent padding before and after the song
  const pad = +S.pad || 0, span = dur + 2 * pad;
  // some browsers and embedded views hand back a file but refuse to write it: render in memory and download instead
  let stream = null;
  if (file) try { stream = await file.createWritable(); } catch (e) { console.warn('cannot write the chosen file, downloading instead', e); file = null; try { localStorage.setItem('augen-export-download', '1'); } catch (_) {} }
  const target = stream ? new Mp4Muxer.FileSystemWritableFileStreamTarget(stream) : new Mp4Muxer.ArrayBufferTarget();
  const muxer = new Mp4Muxer.Muxer({ target, fastStart:stream ? false : 'in-memory', firstTimestampBehavior:'offset',
    video:{ codec:'avc', width:w, height:h, frameRate:fps },
    audio:codecs.audio ? { codec:codecs.audioMux, numberOfChannels:ch, sampleRate:sr } : undefined });
  let failed = null;
  const ve = new VideoEncoder({ output:(c, m) => muxer.addVideoChunk(c, m), error:e => { failed = e; } });
  ve.configure(codecs.video);

  const oc = new OfflineAudioContext(ch, Math.ceil(span * sr), sr);
  const src = oc.createBufferSource(); src.buffer = A.buffer;
  const live = { an:A.an, bands:A.bands };
  Object.assign(A, analysisGraph(oc, src));
  src.connect(oc.destination); src.start(pad, start, dur);

  EXPORT = { t:start - pad, cancel:false, t0:performance.now() };
  let saved = false;
  document.body.classList.add('exporting');
  setCanvasSize(w, h, w, h);
  resetAnalysis();
  V.sectionIdx = -1; V.nCols = 1; newPalette(); newScheme();
  pg.fillStyle = V.bg; pg.fillRect(0, 0, W, H);

  const aRate = fps * Math.ceil(60 / fps), step = 1 / aRate, per = aRate / fps, total = Math.max(1, Math.floor(span * fps));
  const frame = fi => {
    renderFrame(true);
    const vf = new VideoFrame(view, { timestamp:Math.round(fi * 1e6 / fps), duration:Math.round(1e6 / fps) });
    ve.encode(vf, { keyFrame:fi % (fps * 2) === 0 }); vf.close();
  };
  try {
    updateSection(); frame(0);
    const rendered = await new Promise((resolve, reject) => {
      let i = 1;
      const tick = async () => {
        try {
          EXPORT.t = start - pad + i * step;
          analyse(EXPORT.t); updateSection();
          if (i % per === 0) {
            const fi = i / per; frame(fi);
            while (ve.encodeQueueSize > 4) await yieldNow();
            if (fi % 6 === 0) { showProgress(fi / total); await yieldNow(); }
          }
          if (failed) return reject(failed);
          if (EXPORT.cancel) return reject(new Error('cancelled'));
          i++;
          if (i * step < span) oc.suspend(i * step).then(tick);
          oc.resume();
        } catch (e) { reject(e); }
      };
      oc.suspend(step).then(tick);
      oc.startRendering().then(resolve, reject);
    });
    setExportMsg('finishing…');
    await ve.flush();
    if (codecs.audio) {
      const ae = new AudioEncoder({ output:(c, m) => muxer.addAudioChunk(c, m), error:e => { failed = e; } });
      ae.configure(codecs.audio); encodeAudio(rendered, ae); await ae.flush(); ae.close();
    }
    if (failed) throw failed;
    muxer.finalize();
    if (stream) { await stream.close(); saved = true; setExportMsg(`saved ${file.name}`); }
    else {
      const a = document.createElement('a'), blob = new Blob([target.buffer], { type:'video/mp4' });
      target.buffer = null;
      a.href = URL.createObjectURL(blob); a.download = exportName(lengthKey); a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      setExportMsg(`saved ${a.download} · ${(blob.size / 1048576).toFixed(0)} MB`);
    }
  } catch (e) {
    setExportMsg(e.message === 'cancelled' ? 'export cancelled' : 'export failed: ' + e.message);
    console.error(e);
  } finally {
    try { ve.close(); } catch (e) {}
    if (stream && !saved) try { await stream.abort(); } catch (e) {}
    Object.assign(A, live);
    EXPORT = null; document.body.classList.remove('exporting');
    resetAnalysis(); resize(); lastFrame = 0; A.offset = start;
  }
}

const yieldNow = () => new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(0); });
function showProgress(p) {

  $('#exp-bar').style.width = `${(p * 100).toFixed(1)}%`;

}
function setExportMsg(m) { $('#exp-text').textContent = m; $('#exp-msg').textContent = m; }

// recording: canvas + audio → webm/mp4
let rec = null, chunks = [];
$('#rec').onclick = () => {
  if (rec) { rec.stop(); return; }
  initAudio();
  const types = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
  const type = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) return setStatus('recording unsupported');
  const ms = new MediaStream([...view.captureStream(S.fps).getVideoTracks(), ...A.recDest.stream.getAudioTracks()]);
  rec = new MediaRecorder(ms, { mimeType:type, videoBitsPerSecond:16e6 }); chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `${A.name || 'synchromy'}.${type.includes('mp4') ? 'mp4' : 'webm'}`; a.click();
    rec = null; $('#rec').classList.remove('on'); $('#rec').textContent = 'Rec';
  };
  rec.start(1000); $('#rec').classList.add('on'); $('#rec').textContent = 'Stop';
};

// film settings panel
const CONTROLS = [
  ['saturation','Film stock: B&W ↔ Saturated'], ['warmth','Cool ↔ Warm'],
  ['grain','Grain'], ['flicker','Shutter flicker'], ['dust','Dust & specks'], ['scratch','Scratches & hairs'], ['weave','Gate weave'],
  ['boil','Hand-drawn boil'], ['vignette','Vignette'], ['chroma','Colour fringe'], ['halation','Halation'],
];
function addSlider(parent, k, label, after) {
  const l = document.createElement('label'); l.innerHTML = `<span>${label}</span><input type="range" min="0" max="1" step="0.01" value="${S[k]}">`;
  l.querySelector('input').oninput = e => { S[k] = +e.target.value; saveSettings(); after && after(); }; parent.appendChild(l);
  return l;
}
const panel = $('#settings');
for (const [k, label] of CONTROLS) addSlider(panel, k, label);
addSlider(panel, 'quality', 'Resolution: chunky pixels ↔ full', resize);

// colour panel: which colours the film may use, and how often it reaches for new ones
const cpanel = $('#colour');
const tierName = v => tierOf(v).name;
const palLabel = addSlider(cpanel, 'variety', '', () => { newTheme(); newPalette(); showSwatches(); });
addSlider(cpanel, 'colourRate', 'Colour changes: rare ↔ every beat');
addSlider(cpanel, 'cutSens', 'Cut sensitivity: big changes only ↔ more cuts', () => { if (A.buffer) analyseEnvelope(A.buffer); });
{
  const l = document.createElement('label');
  l.innerHTML = `Ground colour changes<select><option value="sections">At new sections</option><option value="never">Never</option><option value="colours">With every colour change</option></select>`;
  const s = l.querySelector('select'); s.value = S.bgChange; s.onchange = () => { S.bgChange = s.value; saveSettings(); }; cpanel.appendChild(l);
}
const swatchBox = document.createElement('label');
swatchBox.innerHTML = `<span>Current colours</span><div class="swatches"></div>`;
cpanel.appendChild(swatchBox);
const bgBox = document.createElement('label');
bgBox.innerHTML = `<span>Background</span><span class="bgrow"><select>
  <option value="auto">Auto (from palette)</option><option value="black">Black</option><option value="white">White</option>
  <option value="grey">Grey</option><option value="custom">Pick a colour…</option></select><input type="color"></span>`;
const bgSel = bgBox.querySelector('select'), bgPick = bgBox.querySelector('input');
bgSel.value = S.bgMode; bgPick.value = S.bgCustom; bgPick.hidden = S.bgMode !== 'custom';
bgSel.onchange = () => { S.bgMode = bgSel.value; bgPick.hidden = S.bgMode !== 'custom'; saveSettings(); newPalette(); showSwatches(); };
bgPick.oninput = () => { S.bgCustom = bgPick.value; saveSettings(); newPalette(); showSwatches(); };
cpanel.appendChild(bgBox);
const shuffle = document.createElement('button'); shuffle.textContent = 'Shuffle colours';
shuffle.onclick = () => { newTheme(); newPalette(); showSwatches(); }; cpanel.appendChild(shuffle);
function showSwatches() {
  palLabel.querySelector('span').textContent = `Palette: ${tierName(S.variety)}`;
  swatchBox.querySelector('.swatches').innerHTML = (V.theme || []).map(c =>
    `<i style="background:${c}" class="${[V.bg, V.band, V.barCol].includes(c) ? 'used' : ''}"></i>`).join('');
}
setInterval(() => { if (cpanel.classList.contains('open')) showSwatches(); }, 500);
{
  const l = document.createElement('label');
  l.innerHTML = `Frame rate<select><option value="12">12 · on twos</option><option value="24">24 · film</option><option value="60">60 · smooth</option></select>`;
  const s = l.querySelector('select'); s.value = S.fps; s.onchange = () => { S.fps = +s.value; saveSettings(); }; panel.appendChild(l);
  const c = document.createElement('label'); c.className = 'check';
  c.innerHTML = `<input type="checkbox" ${S.edge ? 'checked' : ''}> Show film edge`;
  c.querySelector('input').onchange = e => { S.edge = e.target.checked; saveSettings(); }; panel.appendChild(c);
  const sp = document.createElement('label'); sp.className = 'check';
  sp.innerHTML = `<input type="checkbox" ${S.splices ? 'checked' : ''}> Splice cuts (flash + frame roll)`;
  sp.querySelector('input').onchange = e => { S.splices = e.target.checked; saveSettings(); }; panel.appendChild(sp);
  const h = document.createElement('div'); h.className = 'hint';
  h.textContent = 'space play · 1–6 modes · ← → seek · f fullscreen · h hide controls · drop a file anywhere'; panel.appendChild(h);
}

addEventListener('keydown', e => {
  if (EXPORT) return;
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const modes = ['auto', 'synchromy', 'optical', 'dullcare', 'rows', 'rings'];
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key >= '1' && e.key <= '6') { S.mode = modes[+e.key - 1]; saveSettings(); updateUI(); splice(); }
  else if (e.key === 'ArrowRight') seek(curTime() + 5);
  else if (e.key === 'ArrowLeft') seek(curTime() - 5);
  else if (e.key === 'f') $('#fs').click();
  else if (e.key === 'h') document.body.classList.toggle('idle');
});

let idleTimer;
addEventListener('pointermove', () => {
  document.body.classList.remove('idle'); clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (A.playing || A.mic) document.body.classList.add('idle'); }, 2500);
});
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', async e => {
  e.preventDefault(); document.body.classList.remove('dragging'); initAudio();
  const f = e.dataTransfer.files[0]; if (f) loadArrayBuffer(await f.arrayBuffer(), f.name);
});
addEventListener('resize', resize);

newPalette(); newScheme(); resize(); initGL(); updateUI(); requestAnimationFrame(loop);

// ?src=song.m4a preloads a file when served over http (still needs a click to start the sound)
const qs = new URLSearchParams(location.search).get('src');
if (qs) fetch(qs).then(r => r.arrayBuffer()).then(ab => loadArrayBuffer(ab, qs, false)).catch(() => setStatus('could not load ' + qs));
window.viz = { A, V, S, F, VOICES, seek, play, pause, newScheme, newPalette, exportMP4 };
</script>
