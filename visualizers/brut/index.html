<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brut Machine</title>
<style>
  :root { --ink:#f3ecd8; --panel:rgba(14,12,10,.78); --line:rgba(243,236,216,.2); --accent:#f05a1a; }
  html,body { margin:0; height:100%; background:#f3f1ea; overflow:hidden; color:var(--ink);
    font:13px/1.3 Futura,"Avenir Next","Helvetica Neue",Arial,sans-serif; }
  canvas#view { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas#view.drag { cursor:grabbing; }
  body.idle canvas#view { cursor:none; }
  .ui { position:fixed; left:16px; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; transition:opacity .5s; }
  body.idle .ui, body.idle #status { opacity:0; pointer-events:none; }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--panel); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  button,select { font:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink);
    background:transparent; border:1px solid var(--line); border-radius:4px; padding:6px 10px; cursor:pointer; }
  select option { background:#1a1714; }
  button:hover,select:hover { border-color:var(--ink); }
  button.on { background:var(--ink); color:#0c0a08; }
  button:disabled { opacity:.4; cursor:default; }
  .seekwrap { position:relative; flex:1; min-width:120px; display:flex; align-items:center; }
  #seek { width:100%; accent-color:var(--accent); margin:0; }
  .tick { position:absolute; top:-3px; width:2px; height:6px; background:var(--ink); opacity:.55; pointer-events:none; transform:translateX(-1px); }
  .time { font-variant-numeric:tabular-nums; opacity:.7; min-width:92px; text-align:right; font-size:12px; }
  .settings { display:none; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 18px; max-height:52vh; overflow:auto; }
  .settings.open { display:grid; }
  .settings label { display:flex; flex-direction:column; gap:4px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; opacity:.85; }
  .settings input[type=range] { accent-color:var(--accent); width:100%; }
  .settings label.check { flex-direction:row; align-items:center; gap:8px; }
  .name { max-width:28ch; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .swatches { display:flex; flex-wrap:wrap; gap:4px; }
  .swatches i { width:16px; height:16px; border-radius:3px; border:1px solid var(--line); }
  .settings label.seed span { display:flex; gap:4px; align-items:center; }
  .settings label.seed input { width:6ch; flex:1; min-width:0; background:transparent; color:inherit; border:1px solid var(--line); border-radius:3px; padding:3px 5px; font:inherit; font-size:12px; font-variant-numeric:tabular-nums; letter-spacing:0; }
  .settings label.seed button { padding:3px 7px; }
  .stats { font-size:11px; opacity:.6; font-variant-numeric:tabular-nums; grid-column:1 / -1; }
  #exporting { display:none; position:fixed; left:50%; bottom:24px; transform:translateX(-50%); width:min(420px, calc(100% - 32px));
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; box-sizing:border-box;
    flex-direction:column; gap:8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  #exporting .track { height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  #exp-bar { height:100%; width:0; background:var(--accent); }
  body.exporting #exporting { display:flex; }
  body.exporting .ui, body.exporting #status { display:none; }
  .hint { font-size:10px; letter-spacing:.1em; text-transform:uppercase; opacity:.45; grid-column:1/-1; }
  #status { position:fixed; top:16px; left:16px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.8; transition:opacity .5s; }
  @media (max-width:640px) { .hide-sm { display:none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="status">building…</div>

<div id="exporting"><div id="exp-text">rendering…</div><div class="track"><div id="exp-bar"></div></div><button id="exp-cancel">Cancel</button></div>
<div class="ui">
  <div class="settings bar" id="exportPanel">
    <label>Size<select id="exp-size"><option value="1080p">1920 × 1080</option><option value="720p">1280 × 720</option><option value="square">1080 × 1080 square</option><option value="vertical">1080 × 1920 vertical</option><option value="4k">3840 × 2160</option></select></label>
    <label>Length<select id="exp-len"><option value="full">Whole song</option><option value="clip">30 s from the playhead</option></select></label>
    <label>File size<select id="exp-q"><option value="master">Master · largest</option><option value="high">High · about half</option><option value="small">Small · for sharing</option></select></label>
    <label>Silence before &amp; after<select id="exp-pad"><option value="0">None</option><option value="2">2 s</option><option value="5">5 s</option><option value="10">10 s</option></select></label>
    <label><span>&nbsp;</span><button id="exp-go">Render MP4</button></label>
    <div class="hint" id="exp-msg">Renders frame by frame at the film frame rate. The buildings, camera, colours, paper and film damage come out exactly as the preview shows them.</div>
  </div>
  <div class="settings bar" id="buildPanel"></div>
  <div class="settings bar" id="cameraPanel"></div>
  <div class="settings bar" id="colourPanel"></div>
  <div class="settings bar" id="lookPanel"></div>
  <div class="bar">
    <button id="loadBtn">Load</button>
    <input type="file" id="file" accept="audio/*,video/*" hidden>
    <button id="playBtn">Play</button>
    <div class="seekwrap"><input type="range" id="seek" min="0" max="1000" value="0"><div id="ticks"></div></div>
    <span class="time" id="time">0:00</span>
    <span class="name hide-sm" id="name">Demo pattern</span>
    <button id="buildBtn">Build</button>
    <button id="cameraBtn" class="hide-sm">Camera</button>
    <button id="colourBtn">Colour</button>
    <button id="lookBtn">Look</button>
    <button id="exportBtn">Export</button>
    <button id="fsBtn" class="hide-sm">Full</button>
  </div>
</div>

function togglePanel(btn, panel) {

$('#exp-go').onclick = async () => {
  if (EXPORT) return;
  if (!A.buffer) return setExportMsg('load a song first: the demo pattern has no audio to export');
  const len = $('#exp-len').value; let file = null;
  // ask where to save first, so the video can stream straight to disk while it renders
  // the save dialog lets the video stream straight to disk, but only branded Chrome/Edge let a page write the file it
  // picked; embedded browsers (or one that refused before) render in memory and download once at the end instead
  let pick = !!window.showSaveFilePicker && !!navigator.userAgentData?.brands?.some(b => !/chromium|brand/i.test(b.brand));
  try { if (localStorage.getItem('augen-export-download') === '1') pick = false; } catch (e) {}
  if (pick) {
    try { file = await showSaveFilePicker({ suggestedName:exportName(len), types:[{ description:'MP4 video', accept:{ 'video/mp4':['.mp4'] } }] }); }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  exportMP4($('#exp-size').value, len, file);
};

addEventListener('dragover', e => e.preventDefault());

let seeking = false;
$('#seek').addEventListener('input', () => { seeking = true; seek($('#seek').value / 1000 * AN.dur); });
$('#seek').addEventListener('change', () => { seeking = false; });
addEventListener('keydown', e => {
  if (EXPORT) return;
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.code === 'Space') { e.preventDefault(); $('#playBtn').click(); }
  else if (e.code === 'ArrowRight') seek(curTime() + 5);
  else if (e.code === 'ArrowLeft') seek(curTime() - 5);
  else if (e.key === 'r') setSeed(1 + Math.floor(Math.random() * 9999));
  else if (e.key === 'f') $('#fsBtn').click();
  else { const k = { b:0, c:1, k:2, l:3, e:4 }[e.key]; if (k != null) togglePanel(...PANELS[k]); }
});
let idleT = 0;
const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2800); };
addEventListener('pointermove', wake); wake();

requestAnimationFrame(frame);
if (pendingLoad) brutLoad(...pendingLoad);
// debug: step the camera frame by frame and record where it is, to measure motion within shots
async function traceCam(t0, t1, fps = 24) {
  const out = []; EXPORT = { still:true }; setSizes(640, 360, 1);
  for (let t = t0; t < t1; t += 1 / fps) {
    renderAt(t, 1 / fps);
    const v = VIEW, half = v === camera ? camera.top : (CAM.Dv || CAM.D) * Math.tan(pcam.fov * D2R / 2);
    const aim = v === camera ? CAM.c : (CAM.el3 && SHOT[(SHOTS[CAM.shot] || {}).kind || 'iso'].mode ? CAM.el3 : CAM.c);
    out.push([t, CAM.shot, aim.x, aim.y, aim.z, half, cycleAt(t).idx, CAM.az, CAM.el, v.position.x, v.position.y, v.position.z]);
  }
  EXPORT = null; resize(); return out;
}
window.BRUT = { traceCam, get CAM() { return CAM; }, snapshot, get BIG() { return BIG; }, get SHOTS() { return SHOTS; }, S, get AN() { return AN; }, get CYCLES() { return CYCLES; }, seek, rebuildAll, scene, camera, DEMO, renderAt, renderer, get VIEW() { return VIEW; } };   // for poking at from the console
